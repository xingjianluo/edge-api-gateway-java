# 网关监听端口
server.port=18080
spring.application.name=edge-api-gateway

# 配置文件路径：可指向外部 JSON 文件，文件变更会被轮询并原子热更新；
# 留空时使用 classpath:gateway-routes.json。
# 运行演示端到端时使用：gateway-routes-demo.json（配合 --spring.profiles.active=demo）
gateway.config.path=gateway-routes-demo.json

# 不限制请求体大小，保证请求体被完整缓冲以便幂等重试
spring.servlet.multipart.enabled=false
server.error.include-message=always

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
