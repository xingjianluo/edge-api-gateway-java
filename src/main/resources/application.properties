# 边缘网关默认配置
spring.application.name=edge-api-gateway
server.port=8080

# 路由/限流规则配置位置：classpath: 或 file:
edge.gateway.config-location=classpath:gateway-config.json
# 是否轮询配置文件自动热更新（file: 位置时生效）
edge.gateway.watch-enabled=false
edge.gateway.watch-interval-millis=2000

# 单测日志可直接在控制台看到 输入/判定依据/归一化结果
logging.level.com.github.xingjianluo=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
